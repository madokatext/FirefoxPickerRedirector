plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.firefoxpickerredirector'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.firefoxpickerredirector'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Compile-time only. LSPosed/Xposed provides these classes inside the hooked process.
    compileOnly files('libs/xposed-api-stub.jar')
}
